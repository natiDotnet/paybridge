<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — PayBridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .logo { font-size: 17px; font-weight: 700; }
    .logo b { color: #047857; }
    p.sub { font-size: 13px; color: #6b7280; margin: 6px 0 22px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    input[type=email], input[type=password] {
      width: 100%; border: 1.5px solid #e5e7eb; border-radius: 10px;
      padding: 12px 14px; font-size: 15px; margin-top: 5px;
    }
    input[type=email]:focus, input[type=password]:focus { outline: none; border-color: #047857; }
    button {
      width: 100%; margin-top: 8px; background: #047857; color: #fff; border: 0;
      border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #065f46; }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
    }
    .created {
      background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
      border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
    }
    .foot { margin-top: 18px; font-size: 13px; color: #6b7280; }
    .foot a { color: #047857; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">PayBridge</div>
    <p class="sub">Sign in to the admin portal or your merchant account.</p>
    {% if created %}<div class="created">Account created. Sign in to see your merchant approval status.</div>{% endif %}
    {% if error %}<div class="error">Wrong email or password. Try again.</div>{% endif %}
    <form method="post" action="/admin/login">
      <label>Email
        <input type="email" name="email" autocomplete="username" autofocus required />
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="foot">New merchant? <a href="/signup">Sign up</a> &mdash; an admin approves new accounts.</p>
  </div>
</body>
</html>
