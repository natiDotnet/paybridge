<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ section|title }}{% endblock %} — PayBridge Admin</title>
  <style>
    :root {
      --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
      --brand: #047857; --brand-soft: #ecfdf5; --danger: #b91c1c; --danger-soft: #fef2f2;
      --amber: #92400e; --amber-soft: #fffbeb;
      --sidebar-w: 216px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f7f6; color: var(--ink); min-height: 100vh;
      display: flex; font-size: 14px;
    }

    /* ---- sidebar ---- */
    .sidebar {
      width: var(--sidebar-w); flex: none; background: #0f172a; color: #cbd5e1;
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    }
    .sidebar .logo {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
      padding: 18px 20px 14px; display: block;
    }
    .sidebar .logo b { color: #34d399; }
    .sidebar nav { flex: 1; padding: 4px 10px; overflow-y: auto; }
    .sidebar nav a {
      display: block; color: #cbd5e1; text-decoration: none; font-size: 13.5px;
      padding: 8px 12px; border-radius: 8px; margin-bottom: 2px;
    }
    .sidebar nav a:hover { background: #1e293b; color: #fff; }
    .sidebar nav a.on { background: #134e4a; color: #6ee7b7; font-weight: 600; }
    .sidebar .side-foot { padding: 12px 10px; border-top: 1px solid #1e293b; font-size: 12px; }
    .sidebar .side-foot .who { color: #94a3b8; display: block; margin-bottom: 8px; word-break: break-all; }
    .sidebar .side-foot form button {
      width: 100%; background: #1e293b; color: #cbd5e1; border: 0; border-radius: 8px;
      padding: 7px 0; font-size: 12.5px; cursor: pointer;
    }
    .sidebar .side-foot form button:hover { color: #fff; background: #334155; }

    /* ---- main column ---- */
    .shell { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 52px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px; padding: 0 20px;
      position: sticky; top: 0; z-index: 20;
    }
    .topbar form.search { flex: 1; max-width: 460px; }
    .topbar input[type=text] {
      width: 100%; border: 1.5px solid var(--line); border-radius: 9px;
      padding: 7px 12px; font-size: 13.5px; background: #f9fafb;
    }
    .topbar input[type=text]:focus { outline: none; border-color: var(--brand); background: #fff; }
    .topbar .bell { margin-left: auto; text-decoration: none; font-size: 16px; padding: 6px 8px; border-radius: 8px; }
    .topbar .bell:hover { background: #f3f4f6; }
    .topbar details.user { position: relative; }
    .topbar details.user summary {
      list-style: none; cursor: pointer; font-size: 13px; font-weight: 600;
      padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--line); white-space: nowrap;
    }
    .topbar details.user summary::-webkit-details-marker { display: none; }
    .topbar details.user[open] summary, .topbar details.user summary:hover { background: #f3f4f6; }
    .topbar details.user .pop {
      position: absolute; right: 0; top: calc(100% + 6px); background: #fff;
      border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(17,24,39,.12);
      padding: 10px 12px; width: 230px; z-index: 30;
    }
    .topbar details.user .pop .mail { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
    .topbar details.user .pop button {
      width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: 8px;
      padding: 7px 0; font-size: 13px; cursor: pointer;
    }
    .topbar details.user .pop button:hover { border-color: var(--danger); color: var(--danger); }

    main { padding: 22px 24px 60px; }
    h1 { font-size: 18px; margin-bottom: 16px; font-weight: 700; }
    h2 { font-size: 13px; margin-bottom: 8px; }
    a { color: var(--brand); }

    /* ---- dense cards & tables ---- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .stat .label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
    .stat b { font-size: 20px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    td { padding: 7px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tbody tr:hover td { background: #f8fafb; }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; }
    .id { font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 11.5px; color: var(--muted); word-break: break-all; }
    pre.payload {
      background: #0f172a; color: #a5f3d0; border-radius: 8px; padding: 12px;
      font-size: 12px; overflow-x: auto; margin-top: 8px; white-space: pre-wrap; word-break: break-all;
    }

    /* ---- status system: same badge everywhere, icon + text (not color alone) ---- */
    .st {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
    }
    .st-succeeded::before, .st-delivered::before, .st-active::before { content: "\2713\00a0"; }
    .st-pending::before, .st-created::before, .st-initiated::before { content: "\25f7\00a0"; }
    .st-failed::before, .st-dead::before, .st-disabled::before, .st-revoked::before { content: "\2715\00a0"; }
    .st-expired::before { content: "\231b\00a0"; }
    .st-succeeded, .st-delivered, .st-active { background: var(--brand-soft); color: var(--brand); }
    .st-pending, .st-created, .st-initiated { background: var(--amber-soft); color: var(--amber); }
    .st-failed, .st-expired, .st-dead, .st-disabled, .st-revoked { background: var(--danger-soft); color: var(--danger); }

    /* ---- timeline ---- */
    .timeline { list-style: none; padding: 2px 0 0; margin: 0; }
    .timeline li { position: relative; padding: 0 0 14px 20px; border-left: 2px solid var(--line); margin-left: 6px; font-size: 13px; }
    .timeline li:last-child { border-left-color: transparent; padding-bottom: 2px; }
    .timeline li::before {
      content: ''; position: absolute; left: -6px; top: 1px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--brand); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line);
    }
    .timeline .t-label { font-weight: 600; }
    .timeline .t-at { color: var(--muted); margin-left: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }

    /* ---- activity chart (pure CSS bars) ---- */
    .chart { display: flex; align-items: flex-end; gap: 5px; height: 130px; padding-top: 6px; }
    .chart .bar {
      flex: 1; background: #10b981; border-radius: 3px 3px 0 0; min-height: 2px;
      opacity: .85; transition: opacity .1s;
    }
    .chart .bar:hover { opacity: 1; }
    .chart .bar.zero { background: var(--line); }
    .chart-days { display: flex; gap: 5px; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
    .chart-days span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }

    /* ---- forms & misc ---- */
    .dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; font-size: 13px; }
    .dl dt { color: var(--muted); }
    .dl dd { word-break: break-all; }
    form.inline { display: inline; }
    button.act {
      background: #fff; border: 1.5px solid var(--line); border-radius: 8px;
      padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink);
    }
    button.act:hover { border-color: var(--brand); color: var(--brand); }
    button.act.danger:hover { border-color: var(--danger); color: var(--danger); }
    button.act.primary { background: var(--brand); color: #fff; border: 0; }
    button.act.primary:hover { background: #065f46; color: #fff; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filters input[type=text], .filters select {
      border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: #fff;
    }
    .filters input[type=text] { flex: 1; min-width: 200px; }
    .filters button { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .empty { color: var(--muted); font-size: 13px; padding: 12px 4px; }
    .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
    .back { font-size: 13px; text-decoration: none; }

    /* merchant management forms */
    .card form { font-size: 13px; }
    .card label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
    .card input[type=text], .card input[type=email], .card input[type=password], .card input[type=number], .card select, .card textarea {
      display: block; margin-top: 4px;
      border: 1.5px solid var(--line); border-radius: 8px;
      padding: 7px 10px; font-size: 13px; background: #fff; color: var(--ink);
      font-family: inherit;
    }
    .card textarea { width: 100%; }
    .card input:focus, .card select:focus, .card textarea:focus { outline: none; border-color: var(--brand); }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .form-row label { flex: 1; min-width: 150px; }
    td.acct-form { display: flex; gap: 6px; }
    td.acct-form input[type=text] { display: inline; margin-top: 0; width: 150px; font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 12px; }
    td form.inline { display: inline-block; margin-right: 6px; }
    .key-reveal {
      background: var(--amber-soft); border: 1.5px solid #fde68a; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: var(--amber);
    }
    .key-reveal code {
      display: block; margin-top: 6px; padding: 8px 10px;
      background: #fff; border: 1px solid #fde68a; border-radius: 8px;
      font-family: ui-monospace, "Cascadia Mono", monospace; font-size: 13px;
      color: var(--ink); word-break: break-all; user-select: all;
    }

    @media (max-width: 860px) {
      :root { --sidebar-w: 64px; }
      .sidebar .logo { font-size: 12px; padding: 14px 8px; }
      .sidebar nav a { font-size: 11px; padding: 8px 6px; }
      .sidebar .side-foot .who { display: none; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="/admin">PayBridge <b>Admin</b></a>
    <nav>
      <a href="/admin" {% if section == "dashboard" %}class="on"{% endif %}>Dashboard</a>
      <a href="/admin/merchants" {% if section == "merchants" %}class="on"{% endif %}>Merchants</a>
      <a href="/admin/checkouts" {% if section == "checkouts" %}class="on"{% endif %}>Checkouts</a>
      <a href="/admin/webhooks" {% if section == "webhooks" %}class="on"{% endif %}>Webhooks</a>
      <a href="/admin/users" {% if section == "users" %}class="on"{% endif %}>Users</a>
      <a href="/admin/audit" {% if section == "audit" %}class="on"{% endif %}>Audit log</a>
    </nav>
    <div class="side-foot">
      <span class="who">{{ email }}</span>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}" />
        <button type="submit">Sign out</button>
      </form>
    </div>
  </aside>
  <div class="shell">
    <div class="topbar">
      <form class="search" method="get" action="/admin/checkouts">
        <input type="text" name="q" placeholder="Search checkouts — reference, ID, or transaction reference…" />
      </form>
      <a class="bell" href="/admin/webhooks" title="Webhook events">&#128276;</a>
      <details class="user">
        <summary>Admin &#9662;</summary>
        <div class="pop">
          <span class="mail">{{ email }}</span>
          <form method="post" action="/admin/logout">
            <input type="hidden" name="csrf" value="{{ csrf }}" />
            <button type="submit">Sign out</button>
          </form>
        </div>
      </details>
    </div>
    <main>{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
